name: Declaration

# The declaration ratchet, ONE definition -- called by CI on every push and PR,
# and by Release before it creates anything.  Same reason the Makefile keeps a
# single `gates` target that both `make test` and CI's "Contract gates" step
# run: two copies of a check are two checks that can drift, and the copy that
# drifts is always the one nobody watches.
#
# That matters more here than usual.  Release runs only on a tag, so anything
# written inline there is invisible to every gate until a release is already
# under way -- the failure release.yml's own header describes, and the one that
# cost x-lang a v0.4.0 tag.  Calling this from both means the steps a release
# depends on are the same steps that ran green on the commit being tagged.
#
# WHAT IT CHECKS.  x-engine.xon is generated by x-lang's gen-engine-xon.sh and
# committed here, so an edit to tools/contract/isa.x or claims.x has a second
# half -- regenerate and commit -- that nothing in this repo used to check.
# 0.1.5 and 0.2.1 both shipped declaring the digest of the ISA they had before
# their new row; the binary was right both times, so every other gate stayed
# green and x-lang found it on the pin bump.  The logic is in the Makefile
# (`make check-declaration`, via tools/check/declaration.sh), runnable by any
# developer with an x-lang checkout beside this repo.
#
# Platform-independent by construction: the declaration deliberately carries no
# param rows, because word size, byte order and arch are facts of a BUILD and
# not of this source tree.  So one runner settles it.
#
# UNPINNED, on purpose.  Tracking x-lang's default branch means a vocabulary
# change there can turn this red with no commit here -- and that is the honest
# signal: the committed declaration really has gone stale against the generator
# that produces it, and regenerating is the fix either way.  Pin it only if that
# noise outgrows the coupling it is reporting.

on:
  workflow_call:

jobs:
  declaration:
    name: declaration is current
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # No submodules: the generator reads tools/contract/*.x and nothing else.
      - uses: actions/checkout@v7
      - name: Clone x-lang
        run: git clone --depth 1 https://github.com/jonruttan/x-lang.git "$RUNNER_TEMP/x-lang"
      - name: x-engine.xon is what the generator produces
        run: make check-declaration
        env:
          X_LANG_DIR: ${{ runner.temp }}/x-lang
