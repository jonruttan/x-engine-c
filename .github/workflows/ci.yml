name: CI

# The engine's own verdict.  This repo builds a binary that cannot do
# anything alone -- without the x-lang library on its stdin pipe x-bin
# cannot even print -- so what CI can prove here is bounded, and the
# bound is worth stating: the C compiles clean on both platforms, the C
# spec suite passes, the three self-contained contract ratchets agree with
# their manifests, and the whole thing is clean under AddressSanitizer.
#
# Each ratchet has a RUNTIME half -- a spec that probes a live engine --
# and those need a library to boot, so they run in x-lang.  So does
# check-prim-coverage, which asks whether every primitive is EXERCISED:
# most are reachable only through the library, so that answer needs both
# spec suites at once.  Green here means "the C is sound and self
# consistent"; green in x-lang means "the pair works".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  specs:
    name: specs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build
        run: make
      - name: C specs
        run: make test-c
      - name: Bare-engine smoke
        run: make test-bare
      - name: Contract gates
        run: make gates
      # gen-layout must be a no-op: include/x-eval-layout.h is COMMITTED (so a
      # plain checkout builds without awk) and generated from
      # tools/contract/base-layout.x.  A dirty tree here means someone edited
      # the descriptor and did not regenerate the header.
      - name: Generated layout header is current
        run: |
          make gen-layout
          git diff --exit-code include/x-eval-layout.h

  # The declaration ratchet.  x-engine.xon is GENERATED by x-lang's
  # gen-engine-xon.sh and committed here, so an edit to tools/contract/isa.x or
  # claims.x has a second half -- regenerate and commit -- that nothing here
  # used to check.  0.1.5 and 0.2.1 both shipped declaring the digest of the
  # ISA they had before their new row; the binary was right both times, so
  # every other gate stayed green and x-lang found it on the pin bump.
  #
  # Its own job rather than a step in `specs`: it needs a cloned x-lang, which
  # the spec legs do not, and the answer is platform-independent (the
  # declaration deliberately carries no param rows -- word size and arch are
  # facts of a BUILD), so one runner settles it.
  #
  # UNPINNED, on purpose.  Tracking x-lang's default branch means a vocabulary
  # change there can turn this red with no commit here -- and that is the
  # honest signal: the committed declaration really has gone stale against the
  # generator that produces it, and regenerating is the fix either way.  Pin it
  # only if that noise outgrows the coupling it is reporting.
  declaration:
    name: declaration is current
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # No submodules: the generator reads tools/contract/*.x and nothing else.
      - uses: actions/checkout@v7
      - name: Clone x-lang
        run: git clone --depth 1 https://github.com/jonruttan/x-lang.git "$RUNNER_TEMP/x-lang"
      - name: x-engine.xon is what the generator produces
        run: make check-declaration
        env:
          X_LANG_DIR: ${{ runner.temp }}/x-lang


  asan:
    name: asan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Deep tier: main pushes and manual runs, not every PR.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # ASan's stack-use-after-return interacts badly with the deep
      # recursion in eval; the C runner's own harness needs the headroom.
      - name: Raise the stack limit (Linux)
        if: runner.os == 'Linux'
        run: ulimit -s 65520 || true
      - name: C suite under AddressSanitizer
        run: make test-asan
