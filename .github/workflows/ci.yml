name: CI

# The engine's own verdict.  This repo builds a binary that cannot do
# anything alone -- without the x-lang library on its stdin pipe x-bin
# cannot even print -- so what CI can prove here is bounded, and the
# bound is worth stating: the C compiles clean on both platforms, the C
# spec suite passes, the three contracts whose SOURCE half is C still
# agree with their committed manifests, and the whole thing is clean
# under AddressSanitizer.
#
# The other half of every contract is a spec that probes a LIVE engine,
# and those live in x-lang (tests/x/specs/meta/).  So does
# check-prim-coverage, which asks whether every C primitive is actually
# exercised -- an answer spread across BOTH spec suites.  x-lang's CI
# builds this repo as a submodule and runs all of it.  Green here means
# "the C is sound"; green there means "the pair works".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  specs:
    name: specs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build
        run: make
      - name: C specs
        run: make test-c

  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # The three gates are pure source scans -- no binary needed -- but
      # the build runs first anyway so a compile break is reported here
      # as a compile break rather than as a mystery gate failure.
      - name: Build
        run: make
      - name: Contract gates
        run: make gates
      # gen-layout must be a no-op: include/x-eval-layout.h is COMMITTED
      # (so a plain checkout builds without awk) and generated from
      # tools/contract/base-layout.x.  A dirty tree here means someone
      # edited the descriptor and did not regenerate the header.
      - name: Generated layout header is current
        run: |
          make gen-layout
          git diff --exit-code include/x-eval-layout.h

  asan:
    name: asan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Deep tier: main pushes and manual runs, not every PR.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # ASan's stack-use-after-return interacts badly with the deep
      # recursion in eval; the C runner's own harness needs the headroom.
      - name: Raise the stack limit (Linux)
        if: runner.os == 'Linux'
        run: ulimit -s 65520 || true
      - name: C suite under AddressSanitizer
        run: make test-asan
